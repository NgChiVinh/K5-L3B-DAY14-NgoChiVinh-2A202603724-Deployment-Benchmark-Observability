# ============================================================
# Render Blueprint (tiêu chí 12) — dùng thay cho railway.toml nếu deploy Render
#   Render Dashboard → New → Blueprint → chọn repo,
#   Blueprint path: 06-lab-complete/render.yaml
#   PORT do Render cấp, Dockerfile CMD đọc ${PORT:-8000}.
# ============================================================
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    plan: free
    # Đường dẫn tính từ gốc repo (code nằm trong thư mục con 06-lab-complete/)
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    buildFilter:
      paths:
        - 06-lab-complete/**
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: AGENT_API_KEY
        sync: false            # secret: điền tay trên dashboard, không ghi trong file
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString

  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList: []            # chỉ cho phép kết nối nội bộ trong Render
    maxmemoryPolicy: noeviction
