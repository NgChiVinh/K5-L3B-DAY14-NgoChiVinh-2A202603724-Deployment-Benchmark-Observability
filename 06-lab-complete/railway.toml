# ============================================================
# Railway deploy config (tiêu chí 12)
#   Deploy: cd 06-lab-complete && railway up
#   Biến môi trường đặt trên Railway (KHÔNG ghi ở đây):
#     AGENT_API_KEY, REDIS_URL (= ${{Redis.REDIS_URL}}), ENVIRONMENT=production
#   PORT do Railway cấp, Dockerfile CMD đọc ${PORT:-8000}.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
